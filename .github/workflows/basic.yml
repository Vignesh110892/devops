name: Greeting with basic linux commands

on: workflow_dispatch

jobs:
  Basics:
    runs-on: self-hosted
    steps:
      - name: Print Helloworld
        run: echo "HelloWorld"
      - name: check runner details
        run: |
          echo "Print the OS Version: $RUNNER_OS"
          pwd
          ls
          echo "The repository is: $GITHUB_REPOSITORY"
