name: Basic job

on: 
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  Basic:
    runs-on: self-hosted
    steps:
      - name: list files
        run: |
          pwd
          ls -la
      - name: Check the tools
        run: |
          git --version
          docker --version
      - name: check the process
        run: ps
