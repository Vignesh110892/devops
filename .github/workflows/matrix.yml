name: matrix for run different version 
on:
  workflow_dispatch:
jobs:
  node:
    runs-on: self-hosted
    strategy:
      matrix:
        node-version: [24, 26]
    steps:
      - name: Clone code
        uses: actions/checkout@v7
      
      - name: Setup NodeJs
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install Dependencies
        run: npm install      
      - name: Create .env file
        run: |
            echo "PORT=8080" >> .env.development
            echo "APP=GHA-NODE-DEV-APP" >> .env.development
            echo "PORT=5000" >> .env.production
            echo "APP=GHA-NODE-PROD-APP" >> .env.production
      - name: Run the application
        run: |
              ENVIRONMENT=production

              if [[ "$ENVIRONMENT" == "production" ]]; then
                PORT=5000
              else
                PORT=8080
              fi

              node app.js "$ENVIRONMENT" &
              APP_PID=$!

              echo "Environment: $ENVIRONMENT"
              echo "Port: $PORT"

              sleep 5

              curl --fail http://localhost:$PORT/
              curl --fail http://localhost:$PORT/health

              kill "$APP_PID"
