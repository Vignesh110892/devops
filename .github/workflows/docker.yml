name: Docker CI pipeline

on: workflow_dispatch

jobs:
  node:
    runs-on: self-hosted
    steps:
      - name: Clone code
        uses: actions/checkout@v7
      - name: Login to Dockerhub
        uses: docker/login-action@v4
        with:
          username: ${{vars.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}
      - name: Build Docker image
        run: docker build -f Dockerfile.distroless -t dockerfile-distroless .
      - name: Tag and push image
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          docker tag dockerfile-distroless:latest ${{ vars.DOCKERHUB_USERNAME }}/vignesh.m:latest
          docker push ${{ vars.DOCKERHUB_USERNAME }}/vignesh.m:$SHORT_SHA
          
